name: Auto-Update LeetCode Stats

on:
  schedule:
    - cron: '0 0 * * *'   # runs every day at midnight UTC
  workflow_dispatch:       # lets you trigger it manually from GitHub too

jobs:
  update-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout portfolio repo
        uses: actions/checkout@v4.2.2
        with:
          path: portfolio
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout profile README repo
        uses: actions/checkout@v4.2.2
        with:
          repository: devanshhhh09/devanshhhh09
          path: profile
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch LeetCode stats and update both files
        run: |
          cp portfolio/.github/workflows/update_leetcode.py ./update_leetcode.py
          cp portfolio/index.html ./index.html
          cp profile/README.md ./README.md
          python update_leetcode.py
          cp index.html portfolio/index.html
          cp README.md profile/README.md

      - name: Commit and push portfolio (index.html)
        run: |
          cd portfolio
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/devanshhhh09/devanshhhh09.github.io.git
          git add index.html
          git diff --cached --quiet || git commit -m "chore: auto-update LeetCode stats [$(date +'%Y-%m-%d')]"
          git push

      - name: Commit and push profile README
        run: |
          cd profile
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/devanshhhh09/devanshhhh09.git
          git add README.md
          git diff --cached --quiet || git commit -m "chore: auto-update LeetCode stats [$(date +'%Y-%m-%d')]"
          git push
