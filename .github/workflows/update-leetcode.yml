name: Auto-Update LeetCode Stats

on:
  schedule:
    - cron: '0 0 * * *'   # runs every day at midnight UTC
  workflow_dispatch:       # lets you trigger it manually from GitHub too

jobs:
  update-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write      # needed to push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch LeetCode stats and update portfolio
        run: python .github/workflows/update_leetcode.py

      - name: Commit and push if stats changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: auto-update LeetCode stats [$(date +'%Y-%m-%d')]"
          git push
